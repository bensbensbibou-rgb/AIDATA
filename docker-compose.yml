version: '3.8'

services:
  # InfluxDB for history
  influxdb:
    image: influxdb:2.7
    container_name: dashboard-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=dashboard
      - DOCKER_INFLUXDB_INIT_BUCKET=history
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token-for-dashboard
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped

  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: dashboard-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  # GMAO API
  gmao-api:
    build:
      context: ./gmao-api
    container_name: dashboard-gmao
    ports:
      - "4100:4100"
    volumes:
      - gmao-data:/app/data
      - ./gmao-api:/app
    restart: unless-stopped

  # BACnet Service (Host mode for Who-Is discovery)
  backend-bacnet:
    build:
      context: .
      dockerfile: Dockerfile.bacnet
    container_name: dashboard-bacnet
    network_mode: host
    volumes:
      - ./data:/app/data
      - .:/app
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('localhost', 8000))" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Main Backend Service
  backend-main:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dashboard-backend
    ports:
      - "8001:8001"
    depends_on:
      - influxdb
      - mosquitto
    volumes:
      - ./data:/app/data
      - .:/app # Optional for live reloading if development
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/api/test" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-main
      - gmao-api
    restart: unless-stopped

  # BACnet-Go Gateway
  bacnet-go:
    build:
      context: ./bacnet-go
    container_name: bacnet-go-server
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8100/api/test" ]
      interval: 45s
      timeout: 10s
      retries: 3

  # n8n Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    networks:
      - default

  # Distech MCP Server
  distech-mcp:
    build:
      context: ./distech_mcp_server_full
    container_name: distech-mcp
    ports:
      - "8002:8000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('localhost', 8000))" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # BACnet MCP Server
  bacnet-mcp:
    build:
      context: ./bacnet-mcp
    container_name: bacnet-mcp
    ports:
      - "8050:8050"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect(('localhost', 8050))" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # MQTT MCP Server
  mqtt-mcp:
    build:
      context: ./mqtt-mcp-main/mqtt-mcp-main
    container_name: mqtt-mcp
    ports:
      - "8081:8000"
    restart: unless-stopped
    environment:
      - mqtt_mcp_mqtt__host=mosquitto
      - mqtt_mcp_mqtt__port=1883

volumes:
  influxdb-data:
  influxdb-config:
  mosquitto-data:
  mosquitto-log:
  gmao-data:
  n8n-data:
