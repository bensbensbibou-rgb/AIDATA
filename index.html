<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Energy Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          colors: {
            apple: {
              gray: '#f5f5f7',
              dark: '#000000',
              card: '#ffffff',
              cardDark: '#1c1c1e',
              blue: '#007aff',
              orange: '#ff9500',
              green: '#34c759',
              red: '#ff3b30',
              purple: '#af52de',
              teal: '#5ac8fa',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Apple-like scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.8);
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .dark .glass {
      background: rgba(28, 28, 30, 0.7);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-hover {
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .card-hover:hover {
      transform: scale(1.01);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
    }

    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }

    .shake {
      animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both infinite;
      transform: translate3d(0, 0, 0);
    }

    @keyframes shake {

      10%,
      90% {
        transform: translate3d(-1px, 0, 0);
      }

      20%,
      80% {
        transform: translate3d(2px, 0, 0);
      }

      30%,
      50%,
      70% {
        transform: translate3d(-2px, 0, 0);
      }

      40%,
      60% {
        transform: translate3d(2px, 0, 0);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@18.3.1/",
    "react": "https://aistudiocdn.com/react@18.3.1",
    "recharts": "https://aistudiocdn.com/recharts@2.12.3",
    "react-dom": "https://aistudiocdn.com/react-dom@18.3.1"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body
  class="bg-apple-gray text-gray-900 dark:bg-apple-dark dark:text-gray-100 transition-colors duration-300 selection:bg-apple-blue selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
