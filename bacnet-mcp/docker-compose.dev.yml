version: '3.8'

services:
  # Service principal BACnet MCP
  bacnet-mcp:
    build: .
    container_name: bacnet-mcp-dev
    ports:
      - "8000:8000"  # Interface web
      - "8080:8080"  # Serveur MCP BACnet
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=true
      - N8N_WEBHOOK_URL=http://localhost:5678/webhook/a889d2ae-2159-402f-b326-5f61e90f602e/chat
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - .:/app  # Montage du code source pour le développement
    restart: unless-stopped
    networks:
      - bacnet-network

  # Service n8n pour l'automatisation
  n8n:
    image: n8nio/n8n:latest
    container_name: bacnet-n8n-dev
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - bacnet-network

  # Service Redis pour le cache
  redis:
    image: redis:7-alpine
    container_name: bacnet-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - bacnet-network

  # Adminer pour gérer les bases de données
  adminer:
    image: adminer:latest
    container_name: bacnet-adminer
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - bacnet-network

volumes:
  n8n_data:
  redis_data:

networks:
  bacnet-network:
    driver: bridge
