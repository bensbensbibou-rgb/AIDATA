
services:

  bacnet-mcp:

    build: .

    image: bacnet-mcp:latest

    container_name: bacnet-mcp

    network_mode: host          # nécessaire pour le broadcast BACnet/IP (UDP 47808)

    restart: unless-stopped

    env_file:

      - .env

    environment:

      HOST: "${HOST:-0.0.0.0}"

      PORT: "${PORT:-8000}"     # mets 8050 si ton app écoute sur 8050

      BACNET_PORT: "${BACNET_PORT:-47808}"

    # Si ton server.py expose FastAPI sous "app", décommente la ligne suivante

    # pour lancer uvicorn plutôt que "python server.py":

    # command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]

