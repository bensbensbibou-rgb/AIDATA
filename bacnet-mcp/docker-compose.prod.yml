version: '3.8'

services:
  # Service principal BACnet MCP
  bacnet-mcp:
    build: .
    container_name: bacnet-mcp-prod
    expose:
      - "8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=false
      - N8N_WEBHOOK_URL=http://localhost:5678/webhook/a889d2ae-2159-402f-b326-5f61e90f602e/chat
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks:
      - bacnet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service n8n pour l'automatisation
  n8n:
    image: n8nio/n8n:latest
    container_name: bacnet-n8n-prod
    expose:
      - "5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_USER_MANAGEMENT_DISABLED=true
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - bacnet-network

  # Service Redis pour le cache
  redis:
    image: redis:7-alpine
    container_name: bacnet-redis-prod
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - bacnet-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-password123}

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: bacnet-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - bacnet-mcp
      - n8n
    networks:
      - bacnet-network

  # Prometheus pour le monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: bacnet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - bacnet-network

  # Grafana pour les dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: bacnet-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - bacnet-network

volumes:
  n8n_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  bacnet-network:
    driver: bridge
